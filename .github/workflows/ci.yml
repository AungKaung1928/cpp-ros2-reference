name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # Same target as the README: ROS 2 Humble on Ubuntu 22.04.
    runs-on: ubuntu-latest
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: src/cpp_ros2_reference
      - name: rosdep
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths src --ignore-src -y --rosdistro humble
      - name: colcon build
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --event-handlers console_direct+
      - name: colcon test
        run: |
          source /opt/ros/humble/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
      - name: README example (oddeven)
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          timeout 30 ros2 run cpp_ros2_reference oddeven > oddeven.log 2>&1 &
          sleep 3
          ros2 topic pub -t 3 /number std_msgs/msg/Int32 "{data: 7}"
          sleep 1
          cat oddeven.log
          grep -q "7 is odd" oddeven.log
